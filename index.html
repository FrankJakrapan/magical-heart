<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Magical Heart</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,500;1,300&family=Great+Vibes&display=swap">
<link rel="stylesheet" href="src/style.css?v=3">
</head>
<body>
  <canvas id="scene"></canvas>
  <div class="vignette"></div>

  <div class="tribute">
    <div class="photo-frame">
      <img id="photo" src="assets/photo.png?v=3" alt="">
    </div>
  </div>

  <canvas id="front"></canvas>

  <div class="caption-block">
    <p class="caption caption-small">happy 5 months</p>
    <p class="caption caption-script">to my favorite person</p>
  </div>


  <script>
    // ถ้ายังไม่ได้ใส่รูป ให้ซ่อนกรอบไว้ ข้อความยังอยู่ครบ
    document.getElementById('photo').addEventListener('error', function () {
      document.querySelector('.photo-frame').classList.add('empty');
    });
  </script>

  <script src="src/heart.js?v=3"></script>
  <script src="src/particle.js?v=3"></script>
  <script src="src/effects.js?v=3"></script>
  <script src="src/main.js?v=3"></script>

</html>
