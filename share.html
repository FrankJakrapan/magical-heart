<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Magical Heart — scan to open</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;500&family=Great+Vibes&display=swap">
<style>
  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    min-height: 100%;
    background: #01030c;
    color: #eaf3ff;
    font-family: "Cormorant Garamond", Georgia, serif;
    display: grid;
    place-items: center;
    overflow: hidden;
  }

  /* ---------- ฉากหลัง ---------- */
  .sky {
    position: fixed;
    inset: 0;
    background:
      radial-gradient(60% 42% at 50% 34%, rgba(37, 99, 235, 0.34) 0%, rgba(37, 99, 235, 0) 70%),
      radial-gradient(45% 38% at 16% 74%, rgba(14, 116, 144, 0.30) 0%, rgba(14, 116, 144, 0) 70%),
      radial-gradient(50% 40% at 86% 22%, rgba(79, 70, 229, 0.28) 0%, rgba(79, 70, 229, 0) 70%),
      radial-gradient(120% 90% at 50% 100%, #0a1734 0%, #01030c 62%);
  }

  .sky::after {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at 50% 45%,
      rgba(0, 0, 0, 0) 30%, rgba(0, 0, 0, 0.35) 70%, rgba(1, 3, 12, 0.9) 100%);
  }

  /* ลูกแสงลอย */
  .orb {
    position: fixed;
    left: var(--x);
    top: var(--y);
    width: var(--s);
    height: var(--s);
    border-radius: 50%;
    background: radial-gradient(circle at 34% 32%,
      rgba(255, 255, 255, 0.95) 0%,
      rgba(191, 219, 254, 0.65) 26%,
      rgba(96, 165, 250, 0.28) 52%,
      rgba(59, 130, 246, 0) 74%);
    opacity: var(--o);
    filter: blur(0.4px);
    animation: drift var(--dur) ease-in-out infinite;
    animation-delay: var(--delay);
    pointer-events: none;
  }

  .orb:nth-child(3n) { filter: blur(3px); }
  .orb:nth-child(5n) { filter: blur(7px); }

  @keyframes drift {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50%      { transform: translate(var(--dx), -46px) scale(1.14); }
  }

  /* ---------- การ์ด ---------- */
  .card {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 26px;
    padding: 46px 52px 50px;
    margin: 24px;
    border-radius: 30px;
    text-decoration: none;
    color: inherit;
    background: linear-gradient(168deg, rgba(18, 32, 66, 0.72), rgba(6, 13, 33, 0.82));
    box-shadow:
      inset 0 1px 0 rgba(219, 234, 254, 0.25),
      0 0 70px rgba(37, 99, 235, 0.35),
      0 30px 80px rgba(0, 0, 0, 0.65);
    backdrop-filter: blur(6px);
  }

  /* ขอบเรืองแสงบาง ๆ */
  .card::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 30px;
    padding: 1px;
    background: linear-gradient(150deg,
      rgba(219, 234, 254, 0.75),
      rgba(147, 197, 253, 0.18) 42%,
      rgba(59, 130, 246, 0.5));
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
    mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);
    pointer-events: none;
  }

  /* แสงฟุ้งหลังการ์ด */
  .card::after {
    content: "";
    position: absolute;
    inset: -18%;
    border-radius: 50%;
    background: radial-gradient(closest-side,
      rgba(96, 165, 250, 0.28), rgba(59, 130, 246, 0) 100%);
    filter: blur(14px);
    z-index: -1;
    animation: breathe 5.2s ease-in-out infinite;
  }

  @keyframes breathe {
    0%, 100% { opacity: 0.75; transform: scale(1); }
    50%      { opacity: 1;    transform: scale(1.05); }
  }

  /* ---------- หัวเรื่อง ---------- */
  .title {
    display: flex;
    align-items: center;
    gap: 20px;
    margin: 0;
    font-weight: 500;
    font-size: clamp(15px, 2.6vw, 21px);
    letter-spacing: 0.62em;
    text-indent: 0.62em;
    text-transform: uppercase;
    color: #f2f8ff;
    text-shadow: 0 0 16px rgba(147, 197, 253, 0.8), 0 0 44px rgba(59, 130, 246, 0.5);
  }

  .title::before,
  .title::after {
    content: "";
    width: clamp(26px, 7vw, 52px);
    height: 1px;
    background: linear-gradient(90deg, rgba(191, 219, 254, 0), rgba(191, 219, 254, 0.8));
    box-shadow: 0 0 10px rgba(147, 197, 253, 0.7);
  }

  .title::after {
    background: linear-gradient(90deg, rgba(191, 219, 254, 0.8), rgba(191, 219, 254, 0));
  }

  /* ---------- QR ---------- */
  .qr {
    position: relative;
    padding: 20px;
    border-radius: 24px;
    background: linear-gradient(160deg, #ffffff, #eaf2ff);
    box-shadow:
      0 0 40px rgba(147, 197, 253, 0.5),
      0 14px 34px rgba(0, 0, 0, 0.45),
      inset 0 0 0 1px rgba(15, 23, 42, 0.06);
    animation: beat 2.6s ease-in-out infinite;
  }

  .qr svg { display: block; width: min(62vw, 290px); height: auto; }
  .qr path { fill: #071022; }

  /* มุมทั้งสี่ของกรอบ QR */
  .corner {
    position: absolute;
    width: 18px;
    height: 18px;
    border: 1px solid rgba(191, 219, 254, 0.55);
    box-shadow: 0 0 12px rgba(147, 197, 253, 0.55);
  }

  .corner.tl { top: -9px;    left: -9px;  border-right: 0; border-bottom: 0; border-radius: 8px 0 0 0; }
  .corner.tr { top: -9px;    right: -9px; border-left: 0;  border-bottom: 0; border-radius: 0 8px 0 0; }
  .corner.bl { bottom: -9px; left: -9px;  border-right: 0; border-top: 0;    border-radius: 0 0 0 8px; }
  .corner.br { bottom: -9px; right: -9px; border-left: 0;  border-top: 0;    border-radius: 0 0 8px 0; }

  .heart {
    font-family: "Great Vibes", cursive;
    font-size: 26px;
    line-height: 1;
    margin: -8px 0 0;
    color: #cfe3ff;
    opacity: 0.85;
    text-shadow: 0 0 14px rgba(147, 197, 253, 0.7);
  }

  @keyframes beat {
    0%   { transform: scale(1); }
    5%   { transform: scale(1.028); }
    12%  { transform: scale(1.004); }
    18%  { transform: scale(1.018); }
    26%  { transform: scale(1); }
    100% { transform: scale(1); }
  }

  @media (prefers-reduced-motion: reduce) {
    .qr, .card::after, .orb { animation: none; }
  }

  @media (max-width: 480px) {
    .card { padding: 34px 28px 38px; gap: 20px; }
  }
</style>
</head>
